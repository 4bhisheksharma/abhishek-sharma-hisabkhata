{% extends "admin/base_site.html" %}
{% load i18n static %}
{% block extrastyle %}{{ block.super }}
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .redirect-msg { text-align: center; padding: 40px; font-family: 'Segoe UI', sans-serif; }
  .redirect-msg p { color: #6b7280; font-size: 14px; margin-top: 12px; }
  .redirect-msg a { color: #00d09e; text-decoration: none; font-weight: 600; }
  .redirect-msg a:hover { text-decoration: underline; }
</style>
{% endblock %}
{% block breadcrumbs %}{% endblock %}
{% block content %}
<div class="redirect-msg">
  <p>Redirecting to <a href="{% url 'admin_dashboard' %}">Custom Dashboard</a>...</p>
</div>
<script>window.location.href = "{% url 'admin_dashboard' %}";</script>
{% endblock %}
